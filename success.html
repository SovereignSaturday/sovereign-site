<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Request Received | The Sovereign Saturday</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body{
      margin:0;
      font-family:'Inter',sans-serif;
      background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.85)),
      url('https://i.imgur.com/xN9PtkY.png');
      background-size:cover;
      background-position:center;
      color:#f9fafb;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      text-align:center;
    }
    .card{
      background:rgba(15,15,15,.9);
      border:1px solid rgba(201,162,77,.3);
      padding:3rem 3.5rem;
      border-radius:1.2rem;
      max-width:520px;
    }
    h1{
      font-family:'Playfair Display',serif;
      font-size:2.2rem;
      margin-bottom:.6rem;
    }
    p{
      color:#9ca3af;
      line-height:1.6;
      margin:0;
    }
    .accent{
      color:#c9a24d;
      letter-spacing:.14em;
      text-transform:uppercase;
      font-size:.75rem;
      margin-bottom:.7rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="accent">Request Received</div>
    <h1>We’ll Be in Touch Discreetly</h1>
    <p>
      Your inquiry has been received. A member of The Sovereign Saturday team will
      contact you privately to discuss your preferred university, season coverage,
      and travel calendar.
    </p>
  </div>
</body>
</html>
